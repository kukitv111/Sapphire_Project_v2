services:
  # ─── Auth Service ───
  auth-db:
    image: postgres:16-alpine
    container_name: sapphire-auth-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: sapphire_auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sapphire_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-api:
    build:
      context: .
      dockerfile: src/services/Auth/Sapphire.Auth.Api/Dockerfile
    container_name: sapphire-auth-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=auth-db;Port=5432;Database=sapphire_auth;Username=admin;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
      Messaging__SharedSecret: "${EVENT_TRANSPORT_KEY:?Set EVENT_TRANSPORT_KEY}"
      Messaging__Subscribers__0: "http://billing-api:8080"
      Messaging__Subscribers__1: "http://session-api:8080"
      Cors__AllowedOrigins__0: "${ADMIN_ORIGIN:-http://localhost:5173}"
      Jwt__Issuer: "sapphire-auth"
      Jwt__Audience: "sapphire-clients"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "127.0.0.1:5001:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  # ─── Billing Service ───
  billing-db:
    image: postgres:16-alpine
    container_name: sapphire-billing-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: sapphire_billing
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sapphire_billing"]
      interval: 5s
      timeout: 3s
      retries: 5

  billing-api:
    build:
      context: .
      dockerfile: src/services/Billing/Sapphire.Billing.Api/Dockerfile
    container_name: sapphire-billing-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=billing-db;Port=5432;Database=sapphire_billing;Username=admin;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
      Messaging__SharedSecret: "${EVENT_TRANSPORT_KEY:?Set EVENT_TRANSPORT_KEY}"
      Messaging__Subscribers__0: "http://auth-api:8080"
      Messaging__Subscribers__1: "http://session-api:8080"
      Cors__AllowedOrigins__0: "${ADMIN_ORIGIN:-http://localhost:5173}"
      Jwt__Issuer: "sapphire-auth"
      Jwt__Audience: "sapphire-clients"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      billing-db:
        condition: service_healthy

  # ─── Session Service ───
  session-db:
    image: postgres:16-alpine
    container_name: sapphire-session-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: sapphire_session
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - session_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sapphire_session"]
      interval: 5s
      timeout: 3s
      retries: 5

  session-api:
    build:
      context: .
      dockerfile: src/services/Session/Sapphire.Session.Api/Dockerfile
    container_name: sapphire-session-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=session-db;Port=5432;Database=sapphire_session;Username=admin;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
      Messaging__SharedSecret: "${EVENT_TRANSPORT_KEY:?Set EVENT_TRANSPORT_KEY}"
      Messaging__Subscribers__0: "http://auth-api:8080"
      Messaging__Subscribers__1: "http://billing-api:8080"
      Billing__InternalUrl: "http://billing-api:8080"
      Cors__AllowedOrigins__0: "${ADMIN_ORIGIN:-http://localhost:5173}"
      Jwt__Issuer: "sapphire-auth"
      Jwt__Audience: "sapphire-clients"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "127.0.0.1:5003:8080"
    depends_on:
      session-db:
        condition: service_healthy


volumes:
  auth_data:
  billing_data:
  session_data:
